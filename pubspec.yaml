name: ebuk
description: "A lightweight, offline e-book reader for public-domain classics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management: unidirectional reactive data flow
  flutter_riverpod: ^2.6.1

  # Routing: declarative, shell & deep link navigation
  go_router: ^14.8.1

  # Network & Downloads: HTTP client with cancel token & retry support
  dio: ^5.8.0+1

  # Local Database: Type-safe reactive SQLite persistence
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.28

  # File paths & local sandbox directory resolution
  path_provider: ^2.1.5
  path: ^1.9.1

  # Key-value persistent preferences (theme, reading preferences)
  shared_preferences: ^2.5.2

  # Efficient image caching with memory & disk bounds
  cached_network_image: ^3.4.1

  # EPUB document parsing and rendering
  epub_view: ^3.2.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation for Drift & Riverpod
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

  # Unit & mock testing
  mocktail: ^1.0.4

dependency_overrides:
  html: 0.15.4

flutter:
  uses-material-design: true
